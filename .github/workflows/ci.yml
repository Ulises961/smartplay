name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
          components: clippy, rustfmt
      - run: ./scripts/fetch-deps.sh
      # The same checks as `lefthook run local-verify`, so what passes there passes here.
      - run: ./scripts/check-version.sh
      - run: rustfmt --edition 2021 --check $(git ls-files 'crates/**/*.rs')
      - run: cargo clippy --workspace --exclude smartplay-plugin --all-targets -- -D warnings
      - run: cargo test --workspace --exclude smartplay-plugin
      - run: cargo build -p smartplay-plugin --release --target wasm32-wasip1

  # The image is built on every change, not only when it is released, so a broken Dockerfile shows up in the pull request.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t smartplay-engine .
